# Home Assistant 配置示例
# 注意：本集成没有 climate 实体；实际实体为开关/选择器/按钮/传感器。
# 示例中的 entity_id 请替换成添加集成后 HA 实际生成的 ID。

# 1. HomeKit（可选）
homekit:
  - filter:
      include_entities:
        - sensor.XXX_室外新风温度
        - sensor.XXX_室内回风温度
        - sensor.XXX_室内回风pm25
        - sensor.XXX_室内回风co2

# 2. 自动化示例：空气质量差时自动开启新风并调大风量
automation:
  - alias: "空气质量差自动开启新风"
    trigger:
      - platform: state
        entity_id: sensor.XXX_室内回风pm25
    condition:
      - condition: numeric_state
        entity_id: sensor.XXX_室内回风pm25
        above: 100
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.XXX_电源
      - service: select.select_option
        target:
          entity_id: select.XXX_运行模式
        data:
          option: "普通换气"
      - service: select.select_option
        target:
          entity_id: select.XXX_风速
        data:
          option: "高"

  # 3. 每天早上同步时间
  - alias: "同步新风系统时间"
    trigger:
      - platform: time
        at: "08:00:00"
    action:
      - service: fresh_air.sync_time

